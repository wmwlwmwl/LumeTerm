name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag（如 v1.2.3）'
        required: true
        type: string

env:
  NODE_VERSION: '24'

permissions:
  contents: write

jobs:
  # 先唯一创建 draft（含标题/说明），避免多 job 并行竞态清掉 body
  create-draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "${TAG}" in
            v*) ;;
            *)
              echo "tag 必须以 v 开头，当前: ${TAG}" >&2
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
          # 需要完整历史 + 全部 v* tags，才能取「上一版本..当前」提交
          fetch-depth: 0
          fetch-tags: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="LumeTerm ${TAG}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          # 上一发行 tag：按版本号排序，取当前 tag 的前一个 v*
          PREV=$(git tag -l 'v*' --sort=-v:refname | awk -v t="${TAG}" '$0==t{getline; print; exit}')
          {
            echo "## 更新日志"
            if [ -n "${PREV}" ]; then
              echo "（自 ${PREV} 以来）"
              # 跳过 merge、纯「发行 vX」提交；去重
              LOG=$(git log "${PREV}..${TAG}" --pretty=format:'- %s' --no-merges \
                | grep -vE '^- (feat: )?发行 v' \
                | awk 'NF && !seen[$0]++' || true)
              if [ -n "${LOG}" ]; then
                printf '%s\n' "${LOG}"
              else
                echo "- （无新增提交说明）"
              fi
            else
              echo "- 首次发布"
            fi
            echo
            sed "s/__VERSION__/${VERSION}/g" .github/release-notes-footer.md
          } > "${NOTES_FILE}"
          # --target 只能是分支名或 commit SHA，不能传 tag 名（会 422 target_commitish invalid）
          # tag 已存在时，create 不带 --target 即可挂到该 tag
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${{ github.repository }}" \
              --draft=true \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}"
          fi

  build-linux:
    needs: create-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-draft.outputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev \
            libc6-dev libayatana-appindicator3-dev \
            rpm upx-ucl

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        # 版本跟随 go.mod：CLI 必须与库版本一致，免手工维护
        run: |
          set -euo pipefail
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "wails ${WAILS_VERSION}"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Wails
        env:
          VERSION: ${{ needs.create-draft.outputs.version }}
        run: |
          export PATH=$HOME/go/bin:$PATH
          wails build -clean -tags webkit2_41 -ldflags "-s -w" -upx -o LumeTerm
          cp build/bin/LumeTerm "build/LumeTerm-${VERSION}-linux-amd64"
          shasum -a 256 "build/LumeTerm-${VERSION}-linux-amd64" | sed 's|build/||' > "build/LumeTerm-${VERSION}-linux-amd64.sha256"
          echo "binary=${{ github.workspace }}/build/LumeTerm-${VERSION}-linux-amd64" >> $GITHUB_ENV
          echo "binary_sha=${{ github.workspace }}/build/LumeTerm-${VERSION}-linux-amd64.sha256" >> $GITHUB_ENV

      - name: Package .deb & .rpm
        env:
          VERSION: ${{ needs.create-draft.outputs.version }}
        run: |
          # ===== .deb =====
          mkdir -p build/deb/DEBIAN
          mkdir -p build/deb/usr/bin
          mkdir -p build/deb/usr/share/applications
          mkdir -p build/deb/usr/share/icons/hicolor/256x256/apps
          {
            echo "Package: lumeterm"
            echo "Version: ${VERSION}"
            echo "Section: net"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libglib2.0-0, libc6, libayatana-appindicator3-1"
            echo "Maintainer: LumeTerm <admin@662662.xyz>"
            echo "Description: Lightweight Terminal Client"
            echo " A modern, lightweight terminal client built with Wails."
            echo " Quickly manage and connect to your SSH servers."
          } > build/deb/DEBIAN/control
          cp build/bin/LumeTerm build/deb/usr/bin/lumeterm
          sudo chown root:root build/deb/usr/bin/lumeterm
          cp build/appicon.png build/deb/usr/share/icons/hicolor/256x256/apps/lumeterm.png
          cp build/linux/lumeterm.desktop build/deb/usr/share/applications/lumeterm.desktop
          # postinst/postrm 用独立脚本文件安装（不用 heredoc）：
          # heredoc 顶格会破坏 YAML 结构，带缩进又会破坏 shebang，两者无法兼得。
          cp build/linux/postinst build/deb/DEBIAN/postinst
          cp build/linux/postrm build/deb/DEBIAN/postrm
          sudo chmod 755 build/deb/DEBIAN/postinst build/deb/DEBIAN/postrm
          sudo chown root:root build/deb/DEBIAN/postinst build/deb/DEBIAN/postrm
          sudo dpkg-deb --root-owner-group --build build/deb "build/LumeTerm-${VERSION}-linux-amd64.deb"
          shasum -a 256 "build/LumeTerm-${VERSION}-linux-amd64.deb" | sed 's|build/||' > "build/LumeTerm-${VERSION}-linux-amd64.deb.sha256"
          echo "deb=${{ github.workspace }}/build/LumeTerm-${VERSION}-linux-amd64.deb" >> $GITHUB_ENV
          echo "deb_sha=${{ github.workspace }}/build/LumeTerm-${VERSION}-linux-amd64.deb.sha256" >> $GITHUB_ENV

          # ===== .rpm（rpmbuild 原生构建，不再依赖 alien 转换）=====
          RPM_TOPDIR="$HOME/rpmbuild"
          mkdir -p "${RPM_TOPDIR}/SOURCES" "${RPM_TOPDIR}/SPECS" "${RPM_TOPDIR}/BUILD" "${RPM_TOPDIR}/RPMS" "${RPM_TOPDIR}/SRPMS"
          cp build/bin/LumeTerm "${RPM_TOPDIR}/SOURCES/LumeTerm"
          cp build/appicon.png "${RPM_TOPDIR}/SOURCES/appicon.png"
          cp build/linux/lumeterm.desktop "${RPM_TOPDIR}/SOURCES/lumeterm.desktop"
          cp build/linux/lumeterm.spec "${RPM_TOPDIR}/SPECS/lumeterm.spec"
          # rpm Version 字段不允许 '-'（它是 Version/Release 的分隔符）：
          # 把 1.2.6-test-ipc 拆成 Version=1.2.6, Release=1.test_ipc
          VER_RAW="${VERSION#V}"
          RPM_VER="${VER_RAW%%-*}"
          RPM_REL_SUFFIX="${VER_RAW#*-}"
          if [ "${RPM_REL_SUFFIX}" = "${VER_RAW}" ]; then
            RPM_RELEASE="1"
          else
            RPM_RELEASE="1.$(echo "${RPM_REL_SUFFIX}" | sed 's/[^a-zA-Z0-9.]/_/g')"
          fi
          rpmbuild -bb "${RPM_TOPDIR}/SPECS/lumeterm.spec" \
            --define "lum_version ${RPM_VER}" \
            --define "lum_release ${RPM_RELEASE}" \
            --define "_topdir ${RPM_TOPDIR}" \
            --target x86_64
          BUILT_RPM=$(find "${RPM_TOPDIR}/RPMS" -name "lumeterm-*.x86_64.rpm" | head -1)
          cp "${BUILT_RPM}" "build/LumeTerm-${VERSION}-linux-amd64.rpm"
          shasum -a 256 "build/LumeTerm-${VERSION}-linux-amd64.rpm" | sed 's|build/||' > "build/LumeTerm-${VERSION}-linux-amd64.rpm.sha256"
          echo "rpm=${{ github.workspace }}/build/LumeTerm-${VERSION}-linux-amd64.rpm" >> $GITHUB_ENV
          echo "rpm_sha=${{ github.workspace }}/build/LumeTerm-${VERSION}-linux-amd64.rpm.sha256" >> $GITHUB_ENV

      - name: Upload to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-draft.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${binary}" "${binary_sha}" "${deb}" "${deb_sha}" "${rpm}" "${rpm_sha}"

  build-macos:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-draft.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        # 版本跟随 go.mod：CLI 必须与库版本一致，免手工维护
        run: |
          set -euo pipefail
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "wails ${WAILS_VERSION}"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Wails
        run: |
          export PATH=$HOME/go/bin:$PATH
          wails build -clean -ldflags "-s -w" -o LumeTerm
          uname -m
          file build/bin/LumeTerm.app/Contents/MacOS/LumeTerm
          lipo -archs build/bin/LumeTerm.app/Contents/MacOS/LumeTerm

      - name: Package .app to .dmg
        env:
          VERSION: ${{ needs.create-draft.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cp -r build/bin/LumeTerm.app build/LumeTerm.app
          hdiutil create -volname "LumeTerm" -srcfolder build/LumeTerm.app -ov -format UDZO "build/LumeTerm-${VERSION}-macos-${ARCH}.dmg"
          shasum -a 256 "build/LumeTerm-${VERSION}-macos-${ARCH}.dmg" | sed 's|build/||' > "build/LumeTerm-${VERSION}-macos-${ARCH}.dmg.sha256"
          echo "app_dmg=${{ github.workspace }}/build/LumeTerm-${VERSION}-macos-${ARCH}.dmg" >> $GITHUB_ENV
          echo "app_sha=${{ github.workspace }}/build/LumeTerm-${VERSION}-macos-${ARCH}.dmg.sha256" >> $GITHUB_ENV

      - name: Upload to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-draft.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${app_dmg}" "${app_sha}"

  build-windows:
    needs: create-draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-draft.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        # 版本跟随 go.mod：CLI 必须与库版本一致，免手工维护
        shell: bash
        run: |
          set -euo pipefail
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "wails ${WAILS_VERSION}"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install NSIS & UPX
        run: choco install nsis upx -y

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Wails (binary + NSIS installer)
        run: |
          $env:PATH = "$env:USERPROFILE\go\bin;C:\Program Files (x86)\NSIS;" + $env:PATH
          # 不加 -upx：安装包内放未压缩 exe，由 project.nsi 的 LZMA solid 压缩，体积更小；便携版在打包步骤单独 UPX
          wails build -clean -o LumeTerm.exe --nsis -ldflags "-s -w" -trimpath

      - name: Package portable & installer
        shell: bash
        env:
          VERSION: ${{ needs.create-draft.outputs.version }}
        run: |
          set -euo pipefail
          # Windows runner 上 sha256sum / shasum 不一定都有
          sha256_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | sed 's|build/||'
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | sed 's|build/||'
            else
              # Git Bash 常见：certutil
              local h
              h=$(certutil -hashfile "$f" SHA256 | sed -n '2p' | tr -d '\r\n ')
              echo "${h}  $(basename "$f")"
            fi
          }
          cp build/bin/LumeTerm.exe "build/LumeTerm-${VERSION}-windows-amd64-portable.exe"
          # 便携版单独 UPX（--best 对齐本地 build_release.ps1），压缩后再算哈希
          upx --best "build/LumeTerm-${VERSION}-windows-amd64-portable.exe" >/dev/null
          sha256_file "build/LumeTerm-${VERSION}-windows-amd64-portable.exe" > "build/LumeTerm-${VERSION}-windows-amd64-portable.exe.sha256"
          installer=$(ls build/bin/*-installer.exe | head -1)
          cp "${installer}" "build/LumeTerm-${VERSION}-windows-amd64-installer.exe"
          sha256_file "build/LumeTerm-${VERSION}-windows-amd64-installer.exe" > "build/LumeTerm-${VERSION}-windows-amd64-installer.exe.sha256"
          # GITHUB_ENV 在 Windows 上用正斜杠更稳
          WS="${GITHUB_WORKSPACE//\\//}"
          echo "portable=${WS}/build/LumeTerm-${VERSION}-windows-amd64-portable.exe" >> "$GITHUB_ENV"
          echo "portable_sha=${WS}/build/LumeTerm-${VERSION}-windows-amd64-portable.exe.sha256" >> "$GITHUB_ENV"
          echo "installer=${WS}/build/LumeTerm-${VERSION}-windows-amd64-installer.exe" >> "$GITHUB_ENV"
          echo "installer_sha=${WS}/build/LumeTerm-${VERSION}-windows-amd64-installer.exe.sha256" >> "$GITHUB_ENV"

      - name: Upload to Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-draft.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${portable}" "${portable_sha}" "${installer}" "${installer_sha}"

  # 全平台产物齐套后再取消 draft；缺资产则失败，避免半套包变 latest
  publish-release:
    needs: [create-draft, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-draft.outputs.tag }}
          VERSION: ${{ needs.create-draft.outputs.version }}
        run: |
          set -euo pipefail
          required=(
            "LumeTerm-${VERSION}-windows-amd64-portable.exe"
            "LumeTerm-${VERSION}-windows-amd64-portable.exe.sha256"
            "LumeTerm-${VERSION}-windows-amd64-installer.exe"
            "LumeTerm-${VERSION}-windows-amd64-installer.exe.sha256"
            "LumeTerm-${VERSION}-linux-amd64"
            "LumeTerm-${VERSION}-linux-amd64.sha256"
            "LumeTerm-${VERSION}-linux-amd64.deb"
            "LumeTerm-${VERSION}-linux-amd64.deb.sha256"
            "LumeTerm-${VERSION}-linux-amd64.rpm"
            "LumeTerm-${VERSION}-linux-amd64.rpm.sha256"
            "LumeTerm-${VERSION}-macos-arm64.dmg"
            "LumeTerm-${VERSION}-macos-arm64.dmg.sha256"
            "LumeTerm-${VERSION}-macos-amd64.dmg"
            "LumeTerm-${VERSION}-macos-amd64.dmg.sha256"
          )
          assets=$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          missing=0
          for f in "${required[@]}"; do
            if ! printf '%s\n' "${assets}" | grep -Fxq "${f}"; then
              echo "缺少资产: ${f}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "资产未齐套，保持 draft，不发布" >&2
            exit 1
          fi
          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
